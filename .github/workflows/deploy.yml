# Deploy public/ (including the spike, with a toolchain built in CI) to Cloudflare Workers static assets at pizza2go.dzza.workers.dev.
# push to main: deploy. pull_request: --dry-run. workflow_dispatch: deploy.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them, every run is a dry run.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-go@v6
        with:
          # The pinned Go version; the toolchain shipped to the browser is built with it.
          go-version-file: toolchain/go-version
      # Spike toolchain: public/spike is a symlink to spike/. Workers assets cap files at 25MiB,
      # so compile.wasm is split into 20MB parts (spike/harness.js reassembles them).
      - run: |
          spike/build.sh spike/tc
          GOOS=wasip1 GOARCH=wasm go build -C spike/checker -o ../tc/checker.wasm .
          split -d -b 20000000 -a 1 spike/tc/compile.wasm spike/tc/compile.wasm.
          rm spike/tc/compile.wasm spike/tc/exports.txt
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT: ${{ github.event_name }}
        run: |
          dry=
          if [ "$EVENT" = pull_request ]; then dry=--dry-run; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then dry=--dry-run; echo "::warning::no CLOUDFLARE_API_TOKEN secret; dry run only"; fi
          npx --yes wrangler@4.141.0 deploy $dry \
            --name pizza2go \
            --assets public \
            --compatibility-date 2026-09-25
